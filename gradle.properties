# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true

# ---------------------------------------------------------------------------
# CleverTap credentials -- PLACEHOLDERS ONLY. DO NOT COMMIT REAL CREDENTIALS.
# ---------------------------------------------------------------------------
# Override these locally without touching this file, either by putting real
# values in ~/.gradle/gradle.properties (outside the repo) or on the command
# line, e.g.:
#
#   ./gradlew :app:installDebug \
#     -PCLEVERTAP_ACCOUNT_A_ID=xxx-xxx-xxxZ -PCLEVERTAP_ACCOUNT_A_TOKEN=aaa-bbb \
#     -PCLEVERTAP_ACCOUNT_B_ID=yyy-yyy-yyyZ -PCLEVERTAP_ACCOUNT_B_TOKEN=ccc-ddd
#
# Account A -> the HOST / recharge app (CleverTap default instance).
CLEVERTAP_ACCOUNT_A_ID=YOUR_ACCOUNT_A_ID
CLEVERTAP_ACCOUNT_A_TOKEN=YOUR_ACCOUNT_A_TOKEN
# Region is optional. Leave EMPTY unless your account is on a specific region.
# Valid examples: eu1, in1, sg1, us1, aps3, mec1. The SDK ignores a blank value
# and falls back to its default domain.
CLEVERTAP_ACCOUNT_A_REGION=

# Account B -> the OTT SDK (CleverTap additional/secondary instance).
# MUST be a different CleverTap account from Account A for the isolation test
# to mean anything.
CLEVERTAP_ACCOUNT_B_ID=YOUR_ACCOUNT_B_ID
CLEVERTAP_ACCOUNT_B_TOKEN=YOUR_ACCOUNT_B_TOKEN
CLEVERTAP_ACCOUNT_B_REGION=